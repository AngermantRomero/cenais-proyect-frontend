<mat-card class="forgot-password-card">
  <mat-card-header>
    <mat-card-title>Recuperar contraseña</mat-card-title>
    <mat-card-subtitle>Ingresa tu email para recibir un enlace de recuperación</mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content>
  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input 
        matInput 
        type="email" 
        formControlName="email"
        placeholder="ejemplo@correo.com"
        required>
      
      @if (forgotForm.get('email')?.hasError('required')) {
        <mat-error>Email es requerido</mat-error>
      }
      @if (forgotForm.get('email')?.hasError('email')) {
        <mat-error>Ingresa un email válido</mat-error>
      }
    </mat-form-field>

      <button 
  mat-raised-button 
  color="primary" 
  type="submit"
  [disabled]="forgotForm.invalid || isLoading"
  class="submit-button">
  
  @if (!isLoading) {
    <span>Enviar enlace</span>
  }
  @if (isLoading) {
    <mat-spinner diameter="24"></mat-spinner>
  }
</button>
    </form>

    <div class="back-to-login">
      <a routerLink="/auth/login">Volver al login</a>
    </div>
  </mat-card-content>
</mat-card>
