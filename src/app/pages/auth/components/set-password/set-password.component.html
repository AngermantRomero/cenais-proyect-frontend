<div class="password-container mat-elevation-z8">
  <mat-card>
    <!-- Encabezado -->
    <mat-card-header class="header">
      <mat-card-title>
        <mat-icon>lock_reset</mat-icon>
        Nueva Contraseña
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <!-- Campo Nueva Contraseña -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva contraseña</mat-label>
          <input 
            matInput 
            [type]="hideNewPassword ? 'password' : 'text'"
            formControlName="newPassword"
            required>
          <button 
            mat-icon-button 
            matSuffix 
            type="button"
            (click)="hideNewPassword = !hideNewPassword">
            <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Mínimo 8 caracteres con letras y números</mat-hint>
          <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">
            Campo obligatorio
          </mat-error>
          <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('pattern')">
            Debe contener al menos 1 letra y 1 número
          </mat-error>
        </mat-form-field>

        <!-- Campo Confirmar Contraseña -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar contraseña</mat-label>
          <input 
            matInput 
            [type]="hideConfirmPassword ? 'password' : 'text'"
            formControlName="confirmPassword"
            required>
          <button 
            mat-icon-button 
            matSuffix 
            type="button"
            (click)="hideConfirmPassword = !hideConfirmPassword">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
            Campo obligatorio
          </mat-error>
        </mat-form-field>

        <!-- Validación de coincidencia -->
        <mat-error *ngIf="passwordForm.hasError('mismatch')" class="mismatch-error">
          <mat-icon>error</mat-icon> Las contraseñas no coinciden
        </mat-error>

        <!-- Botón de envío -->
        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          [disabled]="passwordForm.invalid || isLoading"
          class="submit-button">
          <span *ngIf="!isLoading">Actualizar Contraseña</span>
          <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
