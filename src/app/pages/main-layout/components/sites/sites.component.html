<div class="mat-elevation-z8 sites-management-container">
  <mat-card>
    <mat-card-header class="management-header">
      <mat-card-title class="management-title">Gestión de Sitios</mat-card-title>
      <mat-card-subtitle class="management-subtitle">Total: {{sites.length}} sitios</mat-card-subtitle>
      
      <button mat-raised-button 
              color="primary" 
              class="add-button"
              (click)="openSiteForm()">
        <mat-icon>add</mat-icon>
        Nuevo Sitio
      </button>
    </mat-card-header>

    <mat-card-content>
      @if (sites.length > 0) {
        <table mat-table [dataSource]="sites" class="sites-table">
          <!-- Columna Código -->
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Código</th>
            <td mat-cell *matCellDef="let site">{{site.code}}</td>
          </ng-container>

          <!-- Columna Localidad -->
          <ng-container matColumnDef="locality">
            <th mat-header-cell *matHeaderCellDef>Localidad</th>
            <td mat-cell *matCellDef="let site">{{site.locality}}</td>
          </ng-container>

          <!-- Columna Provincia -->
          <ng-container matColumnDef="province">
            <th mat-header-cell *matHeaderCellDef>Provincia</th>
            <td mat-cell *matCellDef="let site">
                {{ site.province?.name || 'No asignada' }}
            </td>
          </ng-container>

          <!-- Columna Acciones -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-column">Acciones</th>
            <td mat-cell *matCellDef="let site" class="actions-cell">
              <div class="actions-container">
                <button mat-icon-button 
                        color="accent"
                        matTooltip="Editar sitio"
                        aria-label="Editar sitio"
                        (click)="openSiteForm(site)">
                  <mat-icon>edit</mat-icon>
                </button>
                
                <button mat-icon-button 
                        color="warn"
                        matTooltip="Eliminar sitio"
                        aria-label="Eliminar sitio"
                        (click)="deleteSite(site)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      } @else {
        <div class="no-sites-message">
          <mat-icon>info</mat-icon>
          <p>No se encontraron sitios registrados</p>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
